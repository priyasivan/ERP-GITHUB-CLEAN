<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f7f7f7;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .topbar {
            background: linear-gradient(90deg, #c62828 0%, #e53935 100%);
            color: white;
            padding: 18px 0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .login-wrapper {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .card-header-custom {
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            padding: 28px 28px 10px;
        }

        .logo-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #fceaea;
            color: #c62828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 auto 12px;
        }

        .form-control:focus {
            border-color: #e53935;
            box-shadow: 0 0 0 0.2rem rgba(229, 57, 53, 0.16);
        }

        .btn-login {
            background: #d32f2f;
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>
    <header class="topbar text-center">
        <h3 class="mb-0 fw-bold">ERP MANAGEMENT SYSTEM</h3>
    </header>

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="card-header-custom text-center">
                <div class="logo-circle">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">College ERP Portal</h4>
                <p class="text-muted mb-0">Sign in to access your dashboard</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login text-white w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
