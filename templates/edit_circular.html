<!DOCTYPE html>
<html>
<head>
<title>Add Circular</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px lightgray;
}

h2{
text-align:center;
color:#b30000;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#b30000;
color:white;
border:none;
border-radius:5px;
font-size:16px;
}
</style>

</head>

<body>

<div class="container">
<a href="/department" class="btn btn-outline-secondary mb-3">
    ← Back
</a>
<h2>Add Circular</h2>

<form method="POST">

<label>Title</label>
<input type="text" name="title" value="{{ circular.title }}" required>

<label>Description</label>
<textarea name="description" rows="5" required>{{ circular.description }}</textarea>

<label>Date</label>
<input type="date" name="circular_date" value="{{ circular.circular_date }}" required>

<button type="submit">Update Circular</button>

</form>

</div>

</body>
</html>
