<!DOCTYPE html>
<html>
<head>
<title>Department List</title>
<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:30px;
}
h2{
color:#b30000;
}
button{
background:#b30000;
color:white;
padding:10px 20px;
border:none;
cursor:pointer;
margin-bottom:20px;
}
table{
width:100%;
border-collapse:collapse;
background:white;
}
th{
background:#b30000;
color:white;
padding:10px;
}
td{
padding:10px;
border:1px solid #ddd;
}
a{
text-decoration:none;
}
</style>
</head>
<body>

<a href="/dashboard" class="btn btn-outline-primary mb-3">
    ← Back to Dashboard
</a>

<a href="/add-department">
<button>Add New Department</button>
</a>

<table>
<tr>
<th>Code</th>
<th>Name</th>
<th>Description</th>
<th>Edit</th>
<th>Delete</th>
</tr>

{% for d in departments %}
<tr>
<td>{{ d.dept_code }}</td>
<td>{{ d.dept_name }}</td>
<td>{{ d.description }}</td>
<td><a href="{{ url_for('edit_department', id=loop.index) }}">✏ Edit</a></td>
<td><a href="{{ url_for('delete_department', id=loop.index) }}" onclick="return confirm('Delete this department?')">🗑 Delete</a></td>
</tr>
{% endfor %}

</table>

</body>
</html>
