<!DOCTYPE html>

<html>
<head>
    <title>Staff Profile</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
        }


    .header {
        background: #b30000;
        color: white;
        padding: 18px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
    }

    .profile {
        width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 3px 10px #ccc;
    }

    .profile h2 {
        color: #b30000;
        text-align: center;
        margin-bottom: 25px;
    }

    .row {
        padding: 12px;
        border-bottom: 1px solid #ddd;
    }

    .label {
        font-weight: bold;
        color: #555;
    }

    .value {
        float: right;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 25px;
        background: #b30000;
        color: white;
        padding: 10px;
        text-decoration: none;
        border-radius: 5px;
    }
</style>


</head>

<body>

<div class="header">
    Staff Profile
</div>

<div class="profile">


<h2>My Profile</h2>

<div class="row">
    <span class="label">Staff ID</span>
    <span class="value">{{ staff.staff_id }}</span>
</div>

<div class="row">
    <span class="label">Name</span>
    <span class="value">{{ staff.staff_name }}</span>
</div>

<div class="row">
    <span class="label">Department</span>
    <span class="value">{{ staff.department }}</span>
</div>

<div class="row">
    <span class="label">Designation</span>
    <span class="value">{{ staff.designation }}</span>
</div>

<div class="row">
    <span class="label">Mobile</span>
    <span class="value">{{ staff.mobile }}</span>
</div>

<a href="{{ url_for('staff_dashboard') }}" class="back">
    Back to Dashboard
</a>


</div>

</body>
</html>
