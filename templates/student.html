<!DOCTYPE html>
<html>
<head>

    <title>Student Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

    body{
        background:#f4f6f9;
        font-family:Inter,Segoe UI,sans-serif;
    }

    .page-title{
        color:#b30000;
        font-weight:700;
    }

    .card{
        border:none;
        border-radius:18px;
        box-shadow:0 8px 20px rgba(0,0,0,.08);
    }

    .table{
        margin-bottom:0;
    }

    .table thead{
        background:#b30000;
        color:white;
    }

    .table thead th{
        padding:14px;
    }

    .table tbody tr:hover{
        background:#fff5f5;
    }

    .btn-dashboard{
        background:#6c757d;
        color:white;
        border:none;
    }

    .btn-dashboard:hover{
        background:#5c636a;
        color:white;
    }

    .btn-add{
        background:#b30000;
        color:white;
        border:none;
    }

    .btn-add:hover{
        background:#8a0000;
        color:white;
    }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="page-title">
        <i class="bi bi-person-vcard-fill"></i>
        Student Management
    </h2>

    <div>

        <a href="/dashboard" class="btn btn-dashboard">
            <i class="bi bi-speedometer2"></i>
            Back to Dashboard
        </a>

        <a href="/add-student" class="btn btn-add">
            <i class="bi bi-person-plus-fill"></i>
            Add Student
        </a>

    </div>

</div>

<div class="card">

<div class="card-body">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Register No</th>

<th>Name</th>

<th>Department</th>

<th>Password</th>

<th>Edit</th>

<th>Delete</th>

</tr>
</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{ s.reg_no }}</td>

<td>{{ s.student_name }}</td>

<td>{{ s.department }}</td>

<td>{{ s.password }}</td>

<!-- Edit Button -->
<td>

<a href="/edit-student/{{ s.student_id }}"
class="btn btn-warning btn-sm">

✏️ Edit

</a>

</td>

<!-- Delete Button -->
<td>

<a href="/delete-student/{{ s.reg_no }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this student?')">

🗑 Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
