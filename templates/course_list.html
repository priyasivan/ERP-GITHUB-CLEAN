<!DOCTYPE html>
<html>
<head>
<title>Course List</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:30px;
}

h2{
color:#b30000;
}

button{
background:#b30000;
color:white;
padding:10px 20px;
border:none;
cursor:pointer;
margin-bottom:20px;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#b30000;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border:1px solid #ddd;
}

a{
text-decoration:none;
}

.action-btn{
display:inline-block;
padding:6px 12px;
border-radius:4px;
color:white;
font-size:13px;
}

.edit-btn{
background:#b30000;
}

.delete-btn{
background:#cc3300;
}

</style>

</head>

<body>

<a href="/dashboard" class="btn btn-outline-primary mb-3">
    ← Back to Dashboard
</a>

<a href="/add-course">
<button>Add New Course</button>
</a>

<table>

<tr>

<th>Course Code</th>
<th>Course Name</th>
<th>Department</th>
<th>Duration</th>
<th>Edit</th>
<th>Delete</th>

</tr>

{% for c in courses %}
<tr>

<td>{{ c.course_code }}</td>
<td>{{ c.course_name }}</td>
<td>{{ c.dept_code }}</td>
<td>{{ c.duration }}</td>

<td><a href="/edit-course/{{ loop.index }}" class="action-btn edit-btn">Edit</a></td>
<td><a href="/delete-course/{{ loop.index }}" class="action-btn delete-btn" onclick="return confirm('Delete this course?');">Delete</a></td>

</tr>
{% endfor %}
