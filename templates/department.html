<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Department Module</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

.header{
width:100%;
background:#d90000;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;
text-align:center;
}

.container{
width:95%;
margin:30px auto;
display:flex;
gap:30px;
}

.left-panel{
width:35%;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.left-panel h2{
color:#d90000;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,
textarea{
width:100%;
padding:10px;
margin-top:8px;
border:1px solid #ccc;
border-radius:5px;
}

.button-group{
margin-top:20px;
}

button{
padding:10px 25px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

.save{
background:#d90000;
color:white;
}

.cancel{
background:gray;
color:white;
margin-right:10px;
}

.right-panel{
width:65%;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.right-panel h2{
color:#d90000;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

table th{
background:#d90000;
color:white;
padding:12px;
}

table td{
padding:12px;
text-align:center;
border:1px solid #ddd;
}

</style>

</head>

<body>

<div class="header">
ERP MANAGEMENT SYSTEM
</div>

<div class="container">

<div class="left-panel">

<h2>Add Department</h2>

<form>

<label>Department Code</label>
<input type="text">

<label>Department Name</label>
<input type="text">

<label>Description</label>
<textarea rows="4"></textarea>

<div class="button-group">

<button class="cancel" type="reset">
Cancel
</button>

<button class="save" type="submit">
Save Record
</button>

</div>

</form>

</div>

<div class="right-panel">

<h2>Department List</h2>

<table>

<tr>

<th>Code</th>
<th>Name</th>
<th>Description</th>
<th>Edit</th>
<th>Delete</th>

</tr>

<tr>

<td>CSE</td>
<td>Computer Science</td>
<td>Computer Science Department</td>
<td>✏️</td>
<td>🗑️</td>

</tr>

</table>

</div>

</div>

</body>
</html>
