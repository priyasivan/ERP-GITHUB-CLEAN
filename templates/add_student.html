<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    font-family:Inter,Segoe UI,sans-serif;
}

.page-title{
    color:#b30000;
    font-weight:700;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:10px;
    padding:12px;
}

.form-control:focus,
.form-select:focus{
    border-color:#b30000;
    box-shadow:0 0 0 .2rem rgba(179,0,0,.15);
}

.btn-save{
    background:#b30000;
    color:white;
    border:none;
}

.btn-save:hover{
    background:#8a0000;
    color:white;
}

.btn-back{
    background:#6c757d;
    color:white;
    border:none;
}

.btn-back:hover{
    background:#5c636a;
    color:white;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-body p-4">

<h2 class="page-title mb-4">
<i class="bi bi-person-plus-fill"></i>
Add Student
</h2>

<form method="POST">

<div class="mb-3">
<label class="form-label fw-semibold">Register Number</label>
<input type="text" name="reg_no" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label fw-semibold">Student Name</label>
<input type="text" name="student_name" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label fw-semibold">Department</label>

<select name="department" class="form-select">

{% for dept in departments %}

<option value="{{ dept.dept_name }}">
{{ dept.dept_name }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-4">
<label class="form-label fw-semibold">Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<button class="btn btn-save">
<i class="bi bi-check-circle-fill"></i>
Save Student
</button>

<a href="/student" class="btn btn-back">
<i class="bi bi-arrow-left"></i>
Back
</a>

</form>

</div>

</div>

</div>

</body>
</html>
