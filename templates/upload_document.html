<!DOCTYPE html>
<html>

<head>

<title>Upload Document</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
font-family:Segoe UI;
}

.card{
margin-top:50px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h3>Upload Document</h3>

<hr>

<form action="/upload-document"
method="POST"
enctype="multipart/form-data">

<label>Document Type</label>

<select
class="form-select"
name="document_name"
required>

<option>10th Marksheet</option>

<option>12th Marksheet</option>

<option>Community Certificate</option>

<option>Income Certificate</option>

<option>ABC ID</option>

<option>Internship Certificate</option>

</select>

<br>

<label>Select File</label>

<input
type="file"
class="form-control"
name="document_file"
required>

<br>

<button
type="submit"
class="btn btn-danger">

Upload

</button>

<a href="/digital-locker"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</body>

</html>
