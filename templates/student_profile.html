
<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    font-family:Segoe UI;
}

.header{
    background:#b30000;
    color:white;
    padding:18px;
}

.profile-card{
    border:none;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#b30000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    margin:auto;
}

.info-box{
    background:#fafafa;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
}

.label{
    font-weight:bold;
    color:#666;
}

.value{
    font-size:17px;
    font-weight:600;
}

</style>

</head>

<body>

<div class="header d-flex justify-content-between align-items-center">

<h3>👤 Student Profile</h3>

<a href="/student-dashboard"
class="btn btn-light">

← Dashboard

</a>

</div>

<div class="container mt-4">

<div class="card profile-card p-4">

<div class="avatar">

👤

</div>

<h3 class="text-center mt-3">

{{ student.student_name }}

</h3>

<h5 class="text-center text-muted">

{{ student.reg_no }}

</h5>

<hr>

<h5 class="mb-3">

Personal Information

</h5>

<div class="info-box">

<div class="label">

Full Name

</div>

<div class="value">

{{ student.student_name }}

</div>

</div>

<div class="info-box">

<div class="label">

Register Number

</div>

<div class="value">

{{ student.reg_no }}

</div>

</div>

<div class="info-box">

<div class="label">

Department

</div>

<div class="value">

{{ student.department }}

</div>

</div>

<div class="info-box">

<div class="label">

Email

</div>

<div class="value">

{{ student.email }}

</div>

</div>

</div>

</div>

</body>
</html>
