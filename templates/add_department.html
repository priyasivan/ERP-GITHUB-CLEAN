<!DOCTYPE html>
<html>
<head>
<title>Add Department</title>
<style>
body{
font-family:Arial;
background:#f2f2f2;
}
.container{
width:500px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
}
input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}
button{
background:#b30000;
color:white;
padding:10px 20px;
border:none;
margin-right:10px;
}
</style>
</head>
<body>

<div class="container">

<a href="/department" class="btn btn-outline-secondary mb-3">
    ← Back
</a>

<form method="POST">

<input type="text" name="dept_code" placeholder="Department Code" required>

<input type="text" name="dept_name" placeholder="Department Name" required>

<textarea name="description" placeholder="Description"></textarea>

<button type="submit">Save</button>

<a href="/department">
<button type="button">Cancel</button>
</a>

</form>

</div>

</body>
</html>
