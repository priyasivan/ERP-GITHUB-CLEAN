<!DOCTYPE html>
<html>
<head>
<title>Circular List</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:95%;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px lightgray;
}

h2{
color:#b30000;
}

.btn{
background:#b30000;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#b30000;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.edit{
color:blue;
text-decoration:none;
}

.delete{
color:red;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="mb-3">
    <a href="/dashboard" class="btn btn-outline-danger">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
</div>
<h2>Circular Management</h2>

<a href="/add-circular" class="btn">Add Circular</a>

<table>

<tr>
<th>Title</th>
<th>Description</th>
<th>Date</th>
<th>Edit</th>
<th>Delete</th>
</tr>

{% for row in circulars %}

<tr>

<td>{{ row.title }}</td>

<td>{{ row.description }}</td>

<td>{{ row.circular_date }}</td>

<td>
<a href="/edit-circular/{{ row.circular_id }}" class="edit">Edit</a>
</td>

<td>
<a href="/delete-circular/{{ row.circular_id }}" class="delete">Delete</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
