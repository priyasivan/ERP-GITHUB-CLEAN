<!DOCTYPE html>
<html>
<head>

<title>Student Events</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
    font-family:Segoe UI;
}

.header{
    background:#b30000;
    color:white;
    padding:18px;
}

.card{
    margin-bottom:20px;
    border-radius:12px;
}

.card-title{
    color:#b30000;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header d-flex justify-content-between align-items-center">

<h3>🎉 College Events</h3>

<a href="/student-dashboard"
class="btn btn-light">

← Dashboard

</a>

</div>

<div class="container mt-4">

{% for row in events %}

<div class="card shadow">

<div class="card-body">

<h5 class="card-title">
{{ row.event_name }}
</h5>

<p class="text-muted">
📅 {{ row.event_date }}
</p>

<p>
{{ row.description }}
</p>

</div>

</div>

{% endfor %}

</div>

</body>
</html>
