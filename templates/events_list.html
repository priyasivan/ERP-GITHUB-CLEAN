<!DOCTYPE html>
<html>
<head>
<title>Events</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:95%;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px lightgray;
}

.btn{
background:#b30000;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#b30000;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>

</head>

<body>

<div class="container">
<div class="mb-3">
    <a href="/dashboard" class="btn btn-outline-danger">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
</div>
<h2>Events Management</h2>

<a href="/add-event" class="btn">Add Event</a>

<table>

<tr>

<th>Title</th>
<th>Description</th>
<th>Date</th>
<th>Venue</th>
<th>Edit</th>
<th>Delete</th>

</tr>

{% for row in events %}

<tr>

<td>{{ row.title }}</td>
<td>{{ row.description }}</td>
<td>{{ row.event_date }}</td>
<td>{{ row.venue }}</td>

<td>
<a href="/edit-event/{{ row.event_id }}">Edit</a>
</td>

<td>
<a href="/delete-event/{{ row.event_id }}">Delete</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
