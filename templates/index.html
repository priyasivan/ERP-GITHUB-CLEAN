<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1600");

background-size:cover;
background-position:center;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.card{

width:430px;

background:rgba(255,255,255,.92);

backdrop-filter:blur(12px);

border-radius:20px;

overflow:hidden;

box-shadow:0 15px 35px rgba(0,0,0,.35);

animation:fadeIn 1s;

}

.header{

background:#b30000;

color:white;

text-align:center;

padding:30px;

}

.header img{

width:100px;

height:100px;

border-radius:50%;

background:white;

padding:8px;

margin-bottom:15px;

box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.header h3{

font-weight:bold;

margin-bottom:5px;

}

.header p{

margin-bottom:10px;

font-size:15px;

}

.body{

padding:30px;

}

.btn-login{

width:100%;

padding:14px;

margin-top:15px;

font-size:18px;

font-weight:bold;

border-radius:12px;

transition:.3s;

}

.btn-login:hover{

transform:translateY(-4px);

}

.footer{

text-align:center;

padding:15px;

color:#777;

font-size:13px;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="card">

<div class="header">

<img src="{{ url_for('static', filename='logo.jpeg') }}">

<h3>ST. XAVIER'S COLLEGE</h3>

<p>(AUTONOMOUS), PALAYAMKOTTAI</p>

<h5>ERP MANAGEMENT SYSTEM</h5>

</div>

<div class="body">

<a href="/student-login" class="btn btn-primary btn-login">
🎓 Student Login
</a>

<a href="/staff-login" class="btn btn-success btn-login">
👨‍🏫 Staff Login
</a>

<a href="/login" class="btn btn-danger btn-login">
🛡️ Admin Login
</a>

</div>

<div class="footer">

© 2026 ST. XAVIER'S COLLEGE

</div>

</div>

</body>
</html>
